<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>Chessed</title>
<link rel="icon" href="https://i.ibb.co/5gNQydn7/file-00000000d8b48211a7126ceb0fab8eb6.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --bs:clamp(280px,min(calc(100vw - 34px),calc(100vh - 318px - var(--sat) - var(--sab))),700px);
  --ui:'Fredoka','Comic Sans MS','Chalkboard SE',system-ui,sans-serif;
  --disp:'Bangers','Impact','Arial Black',sans-serif;
  --sh:5px 5px 0 #000;
  --wob:14px 20px 12px 22px/20px 12px 22px 14px;
  --ease:cubic-bezier(.32,.72,0,1);--spring:cubic-bezier(.34,1.45,.64,1);
}
@supports (height:100dvh){:root{--bs:clamp(280px,min(calc(100vw - 34px),calc(100dvh - 318px - var(--sat) - var(--sab))),700px)}}
@supports (transition-timing-function:linear(0,1)){:root{--spring:linear(0,.18 6%,.56 14%,.86 24%,1.02 34%,1.06 42%,1.04 50%,1 62%,.997 74%,1)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;color:#000;font-family:var(--ui);font-weight:500;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  background-color:#fff;background-image:radial-gradient(rgba(0,0,0,.16) 1.6px,transparent 1.9px);background-size:14px 14px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column;background-color:#fff;background-image:radial-gradient(rgba(0,0,0,.16) 1.6px,transparent 1.9px);background-size:14px 14px;will-change:transform}
.screen.on{display:flex}
.outl{text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,0 -3px 0 #000,0 3px 0 #000,-3px 0 0 #000,3px 0 0 #000,6px 6px 0 #000}

/* ---------- loader ---------- */
#loader{z-index:50;align-items:center;justify-content:center;transition:opacity .6s var(--ease),transform .6s var(--ease)}
#loader.out{opacity:0;transform:scale(1.05);pointer-events:none}
#ldCv{position:absolute;inset:0;width:100%;height:100%}
.ldBox{position:relative;display:flex;flex-direction:column;align-items:center;gap:clamp(12px,3vh,26px);padding:20px;width:100%}
.logoWrap{width:min(78vw,500px);aspect-ratio:3/2;display:flex;align-items:center;justify-content:center;animation:logoIn 1.1s var(--spring) both}
.logoWrap img{width:100%;height:100%;object-fit:contain;border-radius:22px;border:4px solid #000;background:#fff;box-shadow:8px 8px 0 #000}
.logoFallback{font-family:var(--disp);font-size:clamp(56px,16vw,110px);color:#fff;letter-spacing:.05em;text-shadow:-3px -3px 0 #000,3px -3px 0 #000,-3px 3px 0 #000,3px 3px 0 #000,8px 8px 0 #000}
@keyframes logoIn{from{opacity:0;transform:scale(.88) translateY(14px)}}
.byWrap{position:relative;padding:0 8px 14px}
.by{display:flex;font-family:var(--disp);font-size:clamp(40px,12vw,76px);letter-spacing:.1em;color:#fff;
  text-shadow:-3px -3px 0 #000,3px -3px 0 #000,-3px 3px 0 #000,3px 3px 0 #000,0 -4px 0 #000,0 4px 0 #000,-4px 0 0 #000,4px 0 0 #000,7px 7px 0 #000}
.by span{display:inline-block;opacity:0;animation:chIn .8s var(--ease) forwards}
.by .sp{width:.35em}
@keyframes chIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.uline{position:absolute;left:0;right:0;bottom:0;width:100%;height:16px;overflow:visible}
.uline path{fill:none;stroke:#000;stroke-width:5;stroke-linecap:round;stroke-dasharray:320;stroke-dashoffset:320;animation:draw 1s 2.2s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.bar{width:min(62vw,330px);height:14px;border:3px solid #000;border-radius:10px;background:#fff;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:#000;transform-origin:left;transform:scaleX(0);transition:transform .35s var(--ease)}
.tapTxt{font-family:var(--disp);font-size:26px;letter-spacing:.08em;height:34px;opacity:0;transition:opacity .5s var(--ease)}
.tapTxt.on{opacity:1;animation:breathe 2s ease-in-out infinite}
@keyframes breathe{50%{opacity:.35}}

/* ---------- komponen umum ---------- */
.box{background:#fff;border:3px solid #000;border-radius:var(--wob);box-shadow:var(--sh)}

/* ---------- menu ---------- */
#menu{overflow-y:auto;-webkit-overflow-scrolling:touch}
.mwrap{width:min(100%,640px);margin:0 auto;padding:18px 16px 130px;display:flex;flex-direction:column;gap:20px}
.mhead{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:4px}
.mhead img{height:clamp(90px,17vh,140px);max-width:84%;object-fit:contain;border-radius:16px;border:4px solid #000;background:#fff;box-shadow:6px 6px 0 #000}
.tag{font-size:15px;text-align:center;background:#000;color:#fff;border-radius:10px;padding:5px 12px;transform:rotate(-1.5deg)}
.sec{background:#fff;border:3px solid #000;border-radius:var(--wob);box-shadow:var(--sh);padding:14px;display:flex;flex-direction:column;gap:12px}
.sec h3{margin:0;font-family:var(--disp);font-weight:400;font-size:26px;letter-spacing:.05em;line-height:1}
.sec .hint{font-size:13px;margin-top:-6px;opacity:.7}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.mode{border:3px solid #000;border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-weight:700;font-size:14px;line-height:1.15;background:#fff;box-shadow:3px 3px 0 #000}
.mode .ic{display:flex;background:#fff;border:3px solid #000;border-radius:12px;padding:1px}
.mode .ic svg{width:30px;height:30px}
.mode small{font-weight:500;font-size:11px;opacity:.75}
.mode.on{background:#000;color:#fff;translate:2px 2px;box-shadow:1px 1px 0 #000}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{border:3px solid #000;border-radius:999px;padding:7px 15px;font-size:15px;font-weight:600;background:#fff;box-shadow:3px 3px 0 #000}
.chip.on{background:#000;color:#fff;translate:2px 2px;box-shadow:1px 1px 0 #000}
.chip.sw{display:flex;align-items:center;gap:8px;padding:5px 14px 5px 6px}
.sw2{display:block;width:28px;height:28px;border:3px solid #000;border-radius:8px;background-color:#fff}
.tgs{display:flex;flex-direction:column;gap:9px}
.tg{display:flex;align-items:center;justify-content:space-between;border:3px solid #000;border-radius:14px;padding:9px 12px;font-size:15px;font-weight:600;text-align:left;width:100%;background:#fff;box-shadow:3px 3px 0 #000}
.tg i{width:46px;height:26px;border:3px solid #000;border-radius:14px;background:#fff;position:relative;flex:none}
.tg i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#000;transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
.tg.on i{background:#000}.tg.on i::after{background:#fff;transform:translateX(20px)}
.lvDesc{font-size:14px;font-weight:500;border:3px dashed #000;border-radius:12px;padding:6px 10px;background:#fff}
.lvgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.lv{min-width:0;overflow:hidden;border:3px solid #000;border-radius:14px;padding:6px 2px;font-size:clamp(11px,3.3vw,13px);font-weight:700;text-align:center;line-height:1.2;background:#fff;box-shadow:3px 3px 0 #000}
.lv b{display:block;font-family:var(--disp);font-weight:400;font-size:26px;line-height:1}
.lv.on{background:#000;color:#fff;translate:2px 2px;box-shadow:1px 1px 0 #000}
.startBar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:4px solid #000;display:flex;justify-content:center}
.btnMain{width:min(100%,608px);background:#000;color:#fff;font-family:var(--disp);font-size:34px;letter-spacing:.08em;line-height:1;border-radius:16px;padding:12px;box-shadow:6px 6px 0 #888;border:3px solid #000}

/* ---------- game ---------- */
#game{align-items:center}
.gbar{width:100%;display:flex;align-items:center;justify-content:space-between;padding:calc(8px + env(safe-area-inset-top)) 14px 6px;max-width:1100px}
.gbar .ttl{font-family:var(--disp);font-size:34px;letter-spacing:.1em;color:#fff;line-height:1;text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,0 3px 0 #000,4px 4px 0 #000}
.ib{width:44px;height:44px;border:3px solid #000;border-radius:12px;background:#fff;box-shadow:3px 3px 0 #000;display:flex;align-items:center;justify-content:center}
.ib svg{width:22px;height:22px;stroke:#000;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.gwrap{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 4px}
.bcol{display:flex;flex-direction:column;gap:10px;width:var(--bs);flex:none}
.scol{display:flex;flex-direction:column;gap:10px;width:var(--bs);min-height:122px;flex:1 0 auto;padding-bottom:calc(10px + var(--sab))}
.pl{display:flex;align-items:center;gap:8px;background:#fff;border:3px solid #000;border-radius:14px;box-shadow:4px 4px 0 #000;padding:4px 8px;min-height:46px;transition:background .15s,color .15s}
.pl.turn{background:#000;color:#fff}
.av{width:30px;height:30px;border-radius:50%;flex:none;border:3px solid #000}
.av.w{background:#fff}.av.b{background:#000}
.pl.turn .av{border-color:#fff}
.pi{display:flex;flex-direction:column;min-width:0;flex:0 1 auto;line-height:1.1}
.pi b{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi span{font-size:12px;opacity:.8;height:15px;white-space:nowrap}
.cap{flex:1;display:flex;flex-wrap:nowrap;align-items:center;justify-content:flex-end;min-width:0;overflow:hidden;padding:2px 2px 2px 0;font-size:13px;font-weight:700;color:#000}
.cap:not(:empty){}
.cap svg{width:19px;height:19px;margin-right:-7px;background:#fff;border-radius:50%;flex:none}
.cap.d svg{margin-right:-11px}.cap.dd svg{margin-right:-13px}
.cap em{font-style:normal;flex:none;margin-left:11px;background:#fff;border:2px solid #000;border-radius:8px;padding:0 6px}
.clk{flex:none;font-family:var(--disp);font-size:24px;letter-spacing:.06em;line-height:1;background:#fff;color:#000;border:3px solid #000;border-radius:10px;padding:3px 8px;min-width:68px;text-align:center}
.pl.turn .clk{border-color:#fff}
.clk.low{animation:lowc .5s steps(2) infinite}
@keyframes lowc{50%{background:#000;color:#fff}}
.dots i{display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;margin-right:3px;animation:dt .9s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dt{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.boardwrap{width:var(--bs);height:var(--bs);position:relative;margin:4px 0 6px}
.boardwrap::after{content:"";position:absolute;inset:-5px;border:5px solid #000;border-radius:10px;box-shadow:8px 8px 0 #000;pointer-events:none;z-index:9}
.boardwrap.inv{filter:invert(1)}
#board{position:absolute;inset:0;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);touch-action:none;background:#fff}
.sq{position:relative;background-color:#fff}
.sq .lb{position:absolute;font-style:normal;font-size:calc(var(--bs)/8*.19);font-weight:700;pointer-events:none;line-height:1;background:#fff;border:1.5px solid #000;border-radius:4px;padding:1px 3px;z-index:2}
.sq .lb:empty{display:none}
.sq .lb.r{top:2px;left:2px}.sq .lb.f{bottom:2px;right:2px}
/* pola kotak gelap: tiap tema */
#board[data-th="0"] .sq.dk,.sw2.p0{background-image:radial-gradient(circle,#000 30%,transparent 33%);background-size:calc(var(--bs)/8/4.5) calc(var(--bs)/8/4.5)}
#board[data-th="1"] .sq.dk,.sw2.p1{background-image:repeating-linear-gradient(45deg,#000 0 2.5px,transparent 2.5px 8px)}
#board[data-th="2"] .sq.dk,.sw2.p2{background-image:repeating-linear-gradient(45deg,#000 0 2px,transparent 2px 7px),repeating-linear-gradient(-45deg,#000 0 2px,transparent 2px 7px)}
#board[data-th="3"] .sq.dk,.sw2.p3{background-color:#b4b4b4}
.sw2.p0{background-size:6px 6px}
#board[data-th="4"] .sq.lt{background-color:#eeeed2}
#board[data-th="4"] .sq.dk{background-color:#769656}
.sw2.p4{background:linear-gradient(135deg,#eeeed2 50%,#769656 50%)}
.sq.last::after{content:"";position:absolute;inset:3px;border:3px dashed #000;background:rgba(255,255,255,.4);box-shadow:0 0 0 2px #fff;z-index:1}
.sq.sel::after{content:"";position:absolute;inset:0;border:5px solid #000;background:rgba(255,255,255,.45);box-shadow:inset 0 0 0 3px #fff;z-index:1}
.sq.hint::after{content:"";position:absolute;inset:3px;border:4px dotted #000;background:rgba(255,255,255,.65);box-shadow:0 0 0 2px #fff;z-index:1}
.sq.mv::before{content:"";position:absolute;left:34%;top:34%;width:32%;height:32%;border-radius:50%;background:#000;border:3px solid #fff;z-index:3}
.sq.cp::before{content:"";position:absolute;inset:2px;border-radius:50%;border:6px solid #000;box-shadow:inset 0 0 0 3px #fff,0 0 0 3px #fff;z-index:3}
.sq.chk{animation:chk .7s steps(2) infinite}
@keyframes chk{0%{box-shadow:inset 0 0 0 5px #000,inset 0 0 0 9px #fff}50%{box-shadow:inset 0 0 0 9px #000,inset 0 0 0 12px #fff}}
.sq.chk .lb{display:none}
#fxl,#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#pieces{position:absolute;inset:0;pointer-events:none}
.piece{position:absolute;left:0;top:0;width:12.5%;height:12.5%;will-change:transform;z-index:4}
.piece svg{width:100%;height:100%;display:block;overflow:visible}
#dim{position:absolute;inset:0;background:rgba(0,0,0,.62);opacity:0;pointer-events:none;transition:opacity .25s;z-index:5}
#dim.on{opacity:1}
#fx{z-index:6}
.btns{display:flex;gap:8px;justify-content:space-between}
.btns button{flex:1;background:#fff;border:3px solid #000;border-radius:12px;box-shadow:3px 3px 0 #000;padding:6px 1px;font-size:clamp(9.5px,2.9vw,12px);letter-spacing:-.01em;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btns button svg{width:20px;height:20px;stroke:#000;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.btns button:disabled{opacity:.35;box-shadow:none}
.moves{background:#fff;border:3px solid #000;border-radius:14px;box-shadow:4px 4px 0 #000;padding:8px 10px;overflow-y:auto;flex:1;min-height:56px;font-size:15px;line-height:1.8;font-weight:600}
.moves .n{opacity:.5;margin-right:3px}
.moves .m{display:inline-block;padding:0 6px;border-radius:6px;margin-right:6px}
.moves .m.cur{background:#000;color:#fff}
@media (min-width:600px) and (min-aspect-ratio:1/1){
  :root{--bs:clamp(200px,min(calc(100vw - 440px),calc(100vh - 205px)),760px)}
  .gwrap{align-items:flex-start}
  .gwrap{flex-direction:row;justify-content:center;align-items:flex-start;gap:26px;padding:0 20px}
  .scol{width:340px;flex:none;max-height:var(--bs);margin-top:56px}
}
@supports (height:100dvh){@media (min-width:600px) and (min-aspect-ratio:1/1){:root{--bs:clamp(200px,min(calc(100vw - 440px),calc(100dvh - 205px)),760px)}}}
@media (max-height:480px) and (min-aspect-ratio:1/1){
  :root{--bs:clamp(170px,min(calc(100vw - 400px),calc(100vh - 168px)),760px)}
  .gbar{padding-top:calc(4px + var(--sat));padding-bottom:2px}
  .ib{width:36px;height:36px}.gbar .ttl{font-size:26px}
  .pl{min-height:36px;padding:2px 8px}.av{width:24px;height:24px}
  .bcol,.scol{gap:6px}.scol{margin-top:42px;width:min(340px,calc(100vw - var(--bs) - 60px))}
  .boardwrap{margin:2px 0 4px}
}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;background-color:rgba(0,0,0,0);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px;visibility:hidden;pointer-events:none;transition:background-color .35s var(--ease),visibility 0s .4s}
#modal.on{visibility:visible;pointer-events:auto;background-color:rgba(0,0,0,.45);transition:background-color .35s var(--ease)}
#modal.sheet{align-items:flex-end;padding:0}
.mbox{background:#fff;border:4px solid #000;border-radius:var(--wob);box-shadow:9px 9px 0 #000;padding:20px;width:min(100%,440px);max-height:88vh;max-height:88dvh;overflow-y:auto;display:flex;flex-direction:column;gap:14px;
  opacity:0;transform:scale(.86);transition:transform .55s var(--spring),opacity .22s var(--ease);will-change:transform}
.mbox.in{opacity:1;transform:none}
#modal.sheet .mbox{width:min(100%,560px);border-radius:26px 26px 0 0;border-bottom:0;box-shadow:none;padding-top:8px;padding-bottom:calc(20px + var(--sab));overscroll-behavior:contain;opacity:1;transform:translateY(104%);transition:transform .5s var(--ease)}
#modal.sheet .mbox.in{transform:none}
#modal.sheet .mbox.drag{transition:none}
.grab{position:sticky;top:-8px;z-index:3;background:#fff;flex:none;height:22px;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab}
.grab i{width:46px;height:6px;border-radius:3px;background:#000;opacity:.85}
.mbox h2{margin:0;font-family:var(--disp);font-weight:400;font-size:38px;letter-spacing:.06em;text-align:center;line-height:1}
.mbox p{margin:0;text-align:center;font-size:17px;font-weight:600}
.mb{display:flex;flex-direction:column;gap:10px}
.mb button{background:#fff;border:3px solid #000;border-radius:14px;box-shadow:4px 4px 0 #000;padding:10px;font-family:var(--disp);font-size:26px;letter-spacing:.06em;line-height:1}
.mb button.pri{background:#000;color:#fff}
.mb button.dng{background:#fff;border-style:dashed}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pick button{border:3px solid #000;border-radius:14px;box-shadow:3px 3px 0 #000;aspect-ratio:1;padding:4px;background:#fff}
.pick svg{width:100%;height:100%}
.res{font-family:var(--disp);font-size:clamp(52px,16vw,76px);text-align:center;line-height:1;color:#fff;letter-spacing:.05em;transform:rotate(-3deg);
  text-shadow:-3px -3px 0 #000,3px -3px 0 #000,-3px 3px 0 #000,3px 3px 0 #000,0 -4px 0 #000,0 5px 0 #000,-4px 0 0 #000,4px 0 0 #000,8px 8px 0 #000}
/* ---------- animasi gaya iOS (hanya transform/opacity, ringan) ---------- */
.chip,.mode,.lv,.tg,.btns button,.ib,.mb button,.btnMain,.pick button{
  transition:scale .45s var(--spring),translate .45s var(--spring),background-color .28s var(--ease),color .28s var(--ease),box-shadow .28s var(--ease),opacity .2s}
.chip:active,.mode:active,.lv:active,.tg:active,.btns button:active:not(:disabled),.ib:active,.mb button:active,.btnMain:active,.pick button:active{
  scale:.95;opacity:.88;transition-duration:.1s,.1s,.28s,.28s,.28s,.1s}
.tg i,.tg i::after{transition:background-color .28s var(--ease),transform .45s var(--spring)}
.pl{transition:background-color .3s var(--ease),color .3s var(--ease)}
.moves .m.cur{animation:mvIn .35s var(--ease)}
@keyframes mvIn{from{opacity:0;transform:translateY(6px) scale(.9)}}
.sq.last::after,.sq.sel::after,.sq.hint::after,.sq.mv::before,.sq.cp::before{animation:fadeIn .2s var(--ease)}
@keyframes fadeIn{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.mini{width:20px;height:20px}

/* ---------- online ---------- */
#toast{position:fixed;left:50%;top:calc(12px + var(--sat));transform:translate(-50%,-170%);z-index:70;max-width:min(92vw,420px);background:#000;color:#fff;border:3px solid #fff;outline:3px solid #000;border-radius:14px;padding:8px 14px;font-weight:700;font-size:15px;text-align:center;pointer-events:none;opacity:0;transition:transform .45s var(--spring),opacity .25s}
#toast.on{transform:translate(-50%,0);opacity:1}
#online{overflow:hidden}
.owrap{flex:1;min-height:0;width:min(100%,640px);margin:0 auto;padding:6px 16px calc(28px + var(--sab));display:flex;flex-direction:column;gap:18px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.inp{width:100%;font:inherit;font-weight:600;font-size:18px;border:3px solid #000;border-radius:12px;padding:10px 12px;background:#fff;color:#000;outline:none;box-shadow:3px 3px 0 #000;-webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none}
.inp:focus{box-shadow:5px 5px 0 #000}
.inp.mask{-webkit-text-security:disc}

        `<circle cx="42" cy="35" r="2.3" fill="${S}"/><path d="M24 50Q26 52 28 50" fill="none" stroke="${S}" stroke-width="2.2" stroke-linecap="round"/>`+
        L('M56 25Q66 33 68 50M60 28Q70 38 71 56')+HL('M36 55Q38 49 42 46M33 70Q32 63 34 59')+SH('M68 62Q69 70 69 76'); break;
    case 3: b=C(50,14,5)+P('M50 19C38 29 34 41 40.5 50C42.5 54 41 58 38.5 62H61.5C59 58 57.5 54 59.5 50C66 41 62 29 50 19Z')+

    case 5: b=P('M31 57L25 31L38 47L40 26L47 45L50 21L53 45L60 26L62 47L75 31L69 57Z')+C(25,28,3.8)+C(40,23,3.8)+C(50,18,3.8)+C(60,23,3.8)+C(75,28,3.8)+R(31,55,38,7,3.5)+P('M36 62H64C64 69 67 74 70 79H30C33 74 36 69 36 62Z')+L('M37 70H63')+HL('M32 54L29 40M36 74L34 68')+SH('M60 64Q62 70 64 75'); break;
    case 6: b=P('M46.5 6H53.5V12H59.5V19H53.5V26H46.5V19H40.5V12H46.5Z')+P('M33 54C29 41 36 31 50 31C64 31 71 41 67 54Z')+R(31,53,38,7,3.5)+P('M36 60H64C64 67 67 73 70 79H30C33 73 36 67 36 60Z')+L('M37 68H63')+HL('M48 9V22M36 48Q34 40 40 35')+SH('M62 62Q64 68 66 74'); break;

function makeAudioGen(){

}

class Pos{
  constructor(){ this.b=new Array(64).fill(0); this.turn=0; this.castle=15; this.ep=-1; this.half=0; this.full=1; this.stack=[]; this.ks=[60,4]; }
  setStart(){
    const back=[4,2,3,5,6,3,2,4];
    this.b.fill(0);
    for(let c=0;c<8;c++){ this.b[c]=back[c]|8; this.b[8+c]=9; this.b[48+c]=1; this.b[56+c]=back[c]; }
    this.turn=0; this.castle=15; this.ep=-1; this.half=0; this.full=1; this.stack=[]; this.ks=[60,4];
    return this;
  }
  fromFEN(fen){
    const parts=fen.split(' '); this.b.fill(0);
    const map={p:1,n:2,b:3,r:4,q:5,k:6};
    let r=0,c=0;
    for(const ch of parts[0]){
      if(ch==='/'){ r++; c=0; }

    }
    this.turn=parts[1]==='b'?1:0;
    this.castle=0; const cs=parts[2]||'-';
    if(cs.includes('K')) this.castle|=1; if(cs.includes('Q')) this.castle|=2; if(cs.includes('k')) this.castle|=4; if(cs.includes('q')) this.castle|=8;
    this.ep=-1; if(parts[3]&&parts[3]!=='-'){ this.ep=(8-(+parts[3][1]))*8+(parts[3].charCodeAt(0)-97); }

  load(d){ this.b=d.b.slice(); this.turn=d.turn; this.castle=d.castle; this.ep=d.ep; this.half=d.half; this.full=d.full||1; this.stack=[]; this.findKings(); return this; }
  data(){ return {b:this.b.slice(),turn:this.turn,castle:this.castle,ep:this.ep,half:this.half,full:this.full}; }
  findKings(){ for(let i=0;i<64;i++){ if(this.b[i]===6) this.ks[0]=i; else if(this.b[i]===14) this.ks[1]=i; } }
  key(){ let s=''; for(let i=0;i<64;i++) s+=String.fromCharCode(65+this.b[i]); return s+this.turn+this.castle+this.ep; }
  attacked(sq,by){
    const b=this.b,r=sq>>3,c=sq&7,col=by?8:0;
    const pr=by?r-1:r+1;
    if(pr>=0&&pr<8){ if(c>0&&b[pr*8+c-1]===(1|col)) return true; if(c<7&&b[pr*8+c+1]===(1|col)) return true; }
    const kn=knightT[sq]; for(let i=0;i<kn.length;i++) if(b[kn[i]]===(2|col)) return true;
    const kg=kingT[sq]; for(let i=0;i<kg.length;i++) if(b[kg[i]]===(6|col)) return true;
    const rb=raysB[sq]; for(let i=0;i<4;i++){ const ray=rb[i]; for(let j=0;j<ray.length;j++){ const p=b[ray[j]]; if(p){ if(p===(3|col)||p===(5|col)) return true; break; } } }
    const rr=raysR[sq]; for(let i=0;i<4;i++){ const ray=rr[i]; for(let j=0;j<ray.length;j++){ const p=b[ray[j]]; if(p){ if(p===(4|col)||p===(5|col)) return true; break; } } }

  }
  inCheck(){ return this.attacked(this.ks[this.turn],this.turn^1); }
  gen(capsOnly){
    const b=this.b,us=this.turn,col=us?8:0,mv=[];
    for(let sq=0;sq<64;sq++){
      const p=b[sq]; if(!p||(p&8)!==col) continue;
      const t=p&7;
      if(t===1){
        const r=sq>>3,c=sq&7,dir=us?1:-1,nr=r+dir; if(nr<0||nr>7) continue;

          else if(!capsOnly){ mv.push(enc(sq,one,0,0)); if(r===(us?1:6)){ const two=one+dir*8; if(b[two]===0) mv.push(enc(sq,two,0,FL.DP)); } }
        }
        for(let dc=-1;dc<=1;dc+=2){
          const nc=c+dc; if(nc<0||nc>7) continue;

          if(tp&&(tp&8)!==col){ if(promo){ for(let pr=5;pr>=2;pr--) mv.push(enc(sq,to,pr,FL.PR|FL.CAP)); } else mv.push(enc(sq,to,0,FL.CAP)); }

  make(m){
    const b=this.b,f=m&63,t=(m>>6)&63,pr=(m>>12)&15,fl=m>>16,us=this.turn,p=b[f];

    if(fl&FL.PR) b[t]=pr|(us?8:0);
    if(fl&FL.CK){ b[t-1]=b[t+1]; b[t+1]=0; }
    if(fl&FL.CQ){ b[t+1]=b[t-2]; b[t-2]=0; }
    if((p&7)===6) this.ks[us]=t;
    this.castle&=CMASK[f]&CMASK[t];
    this.ep=(fl&FL.DP)?((f+t)>>1):-1;
    this.half=((p&7)===1||(fl&FL.CAP))?0:this.half+1;

  }
  unmake(){
    const u=this.stack.pop(),b=this.b; this.turn^=1; const us=this.turn,m=u.m;
    const f=m&63,t=(m>>6)&63,fl=m>>16;
    let p=b[t]; if(fl&FL.PR) p=1|(us?8:0);
    b[f]=p; b[t]=0;
    if(fl&FL.EP) b[u.epCap]=u.cap; else b[t]=u.cap;
    if(fl&FL.CK){ b[t+1]=b[t-1]; b[t-1]=0; }
    if(fl&FL.CQ){ b[t-2]=b[t+1]; b[t+1]=0; }
    if((p&7)===6) this.ks[us]=f;
    this.castle=u.castle; this.ep=u.ep; this.half=u.half; if(us===1) this.full--;
  }
  legal(){
    const out=[],us=this.turn,ms=this.gen(false);
    for(let i=0;i<ms.length;i++){ const m=ms[i]; this.make(m); if(!this.attacked(this.ks[us],us^1)) out.push(m); this.unmake(); }
    return out;
  }
  insufficient(){
    const minors=[];
    for(let i=0;i<64;i++){ const p=this.b[i],t=p&7; if(!t||t===6) continue; if(t===1||t===4||t===5) return false; minors.push(i); }
    if(minors.length<=1) return true;
    if(minors.length===2){
      const a=this.b[minors[0]],c=this.b[minors[1]];
      if((a&7)===3&&(c&7)===3&&(a&8)!==(c&8)){
        const sa=((minors[0]>>3)+(minors[0]&7))&1, sb=((minors[1]>>3)+(minors[1]&7))&1;
        return sa===sb;
      }
    }
    return false;
  }
  material(color){ let s=0; for(let i=0;i<64;i++){ const p=this.b[i]; if(p&&((p&8)?1:0)===color) s+=VAL[p&7]; } return s; }
  evaluate(){
    const b=this.b; let np=0,score=0,bw=0,bb=0;
    for(let i=0;i<64;i++){ const p=b[i]; if(!p) continue; const t=p&7; if(t!==1&&t!==6) np+=VAL[t]; if(t===3){ if(p&8) bb++; else bw++; } }
    const eg=np<2600;
    for(let i=0;i<64;i++){
      const p=b[i]; if(!p) continue; const t=p&7,blk=p&8;
      const idx=blk?(i^56):i;

      score+=blk?-s:s;
    }
    if(bw>=2) score+=30; if(bb>=2) score-=30;
    return this.turn?-score:score;
  }
}

function san(pos,m,legalList){
  const fl=mfl(m),f=mf(m),t=mt(m),p=pos.b[f],type=p&7,files='abcdefgh';
  const sqn=x=>files[x&7]+(8-(x>>3));
  let s;
  if(fl&FL.CK) s='O-O';
  else if(fl&FL.CQ) s='O-O-O';
  else if(type===1){
    s=(fl&FL.CAP)?files[f&7]+'x'+sqn(t):sqn(t);
    if(fl&FL.PR) s+='='+LET[mp(m)];
  } else {
    s=LET[type];
    const others=legalList.filter(o=>o!==m&&mt(o)===t&&(pos.b[mf(o)]&7)===type);
    if(others.length){
      const sf=others.some(o=>(mf(o)&7)===(f&7)), sr=others.some(o=>(mf(o)>>3)===(f>>3));
      if(!sf) s+=files[f&7]; else if(!sr) s+=(8-(f>>3)); else s+=files[f&7]+(8-(f>>3));
    }
    if(fl&FL.CAP) s+='x';
    s+=sqn(t);
  }
  pos.make(m);
  const chk=pos.inCheck(), has=chk?pos.legal().length>0:true;
  pos.unmake();
  if(chk) s+=has?'+':'#';
  return s;
}

const LEVELS=[null,
 {depth:1,noise:350,blunder:0.4,time:0},
 {depth:1,noise:150,blunder:0.15,time:0},
 {depth:2,noise:50,blunder:0.03,time:0},
 {depth:3,noise:12,blunder:0,time:1500},
 {depth:5,noise:0,blunder:0,time:2000},
 {depth:8,noise:0,blunder:0,time:3500}];

function think(pos,cfg,hist){
  const t0=Date.now(); let nodes=0,stopped=false; const limit=cfg.time||0;
  const INF=1000000,MATE=100000;
  const killers=[]; for(let i=0;i<64;i++) killers.push([0,0]);
  function chk(){ if(limit&&(nodes&1023)===0&&Date.now()-t0>limit) stopped=true; }
  function oscore(m,ply){
    const fl=m>>16; let s=0;
    if(fl&FL.CAP){ const vic=(fl&FL.EP)?1:(pos.b[(m>>6)&63]&7); s=20000+VAL[vic]*10-(pos.b[m&63]&7); }
    else if(killers[ply][0]===m) s=9000; else if(killers[ply][1]===m) s=8000;
    if(fl&FL.PR) s+=15000+VAL[(m>>12)&15];
    return s;
  }
  function sortMoves(ms,ply){ const sc=ms.map(m=>oscore(m,ply)); const idx=ms.map((_,i)=>i).sort((a,b)=>sc[b]-sc[a]); return idx.map(i=>ms[i]); }
  function qs(alpha,beta,ply){
    nodes++; chk(); if(stopped) return 0;
    const stand=pos.evaluate();
    if(stand>=beta) return stand;
    if(stand>alpha) alpha=stand;
    if(ply>40) return stand;
    const us=pos.turn,ms=sortMoves(pos.gen(true),Math.min(ply,63));
    for(const m of ms){
      pos.make(m);
      if(pos.attacked(pos.ks[us],us^1)){ pos.unmake(); continue; }
      const sc=-qs(-beta,-alpha,ply+1); pos.unmake();
      if(stopped) return 0;
      if(sc>=beta) return sc;
      if(sc>alpha) alpha=sc;
    }
    return alpha;
  }
  function nm(depth,alpha,beta,ply){
    nodes++; chk(); if(stopped) return 0;
    const us=pos.turn,inCheck=pos.attacked(pos.ks[us],us^1);
    if(inCheck&&ply<14) depth++;
    if(depth<=0) return qs(alpha,beta,ply);
    if(pos.half>=100) return 0;
    const ms=sortMoves(pos.gen(false),Math.min(ply,63));
    let legalCount=0,best=-INF;
    for(const m of ms){
      pos.make(m);
      if(pos.attacked(pos.ks[us],us^1)){ pos.unmake(); continue; }
      legalCount++;
      const sc=-nm(depth-1,-beta,-alpha,ply+1); pos.unmake();
      if(stopped) return 0;
      if(sc>best) best=sc;
      if(sc>alpha) alpha=sc;
      if(alpha>=beta){ if(!((m>>16)&FL.CAP)){ const k=killers[Math.min(ply,63)]; if(k[0]!==m){ k[1]=k[0]; k[0]=m; } } break; }
    }
    if(!legalCount) return inCheck?-MATE+ply:0;
    return best;
  }
  let list=pos.legal();
  if(!list.length) return null;
  if(list.length===1) return list[0];
  if(cfg.blunder&&Math.random()<cfg.blunder) return list[(Math.random()*list.length)|0];
  list=sortMoves(list,0);
  let best=list[0];
  const noise=cfg.noise||0;
  for(let d=1;d<=cfg.depth;d++){
    let alpha=-INF,iterBest=null,iterScore=-INF;
    for(const m of list){
      pos.make(m);
      let s;
      const cnt=hist?(hist.get(pos.key())||0):0;
      if(cnt>=2) s=0;
      else s=-nm(d-1,-INF,noise?INF:-alpha,1);
      pos.unmake();
      if(stopped) break;
      if(noise&&d===cfg.depth) s+=(Math.random()*2-1)*noise;
      if(s>iterScore){ iterScore=s; iterBest=m; }
      if(!noise&&s>alpha) alpha=s;
    }
    if(stopped) break;
    best=iterBest;
    list=[best].concat(list.filter(x=>x!==best));
    if(Math.abs(iterScore)>MATE-100) break;
    if(limit&&Date.now()-t0>limit*0.5) break;
  }

/* ================= engine / worker ================= */
let worker=null,wseq=0; const wpend=new Map();
function initWorker(){
  try{
    const src='const L=('+makeChessLib.toString()+')();self.onmessage=function(e){var d=e.data;var pos=new L.Pos().load(d.pos);var mv=L.think(pos,d.cfg,new Map(d.hist));self.postMessage({id:d.id,move:mv});};';
    worker=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));
    worker.onmessage=e=>{ const r=wpend.get(e.data.id); if(r){ wpend.delete(e.data.id); r.res(e.data.move); } };
    worker.onerror=()=>{ worker=null; for(const [id,r] of wpend){ wpend.delete(id); r.fallback(); } };
  }catch(e){ worker=null; }
}
function askEngine(level,timeLeft){
  const cfg=Object.assign({},LIB.LEVELS[level]);
  if(timeLeft>0){ cfg.time=Math.max(200,Math.min(cfg.time||3000,timeLeft/25)); }
  const payload={id:++wseq,pos:G.pos.data(),hist:[...G.counts],cfg};
  return new Promise(res=>{
    let done=false;
    const fb=()=>{ if(done) return; done=true; wpend.delete(payload.id); setTimeout(()=>{ res(LIB.think(new Pos().load(payload.pos),cfg,new Map(payload.hist))); },20); };
    const ok=m=>{ if(done) return; done=true; clearTimeout(tm); res(m); };
    const tm=setTimeout(fb,(cfg.time||1000)+6000);
    if(worker){ wpend.set(payload.id,{res:ok,fallback:fb}); worker.postMessage(payload); } else fb();
  });
}

function buildBoard(){
  const b=$('#board'); b.innerHTML=''; G.cells=[];
  for(let i=0;i<64;i++){ const d=el('div','sq','<i class="lb r"></i><i class="lb f"></i>'); b.appendChild(d); G.cells.push(d); }

}
function layoutBoard(){
  for(let dr=0;dr<8;dr++)for(let dc=0;dc<8;dc++){
    const cell=G.cells[dr*8+dc], sq=toSq(dr,dc);
    cell.dataset.sq=sq; cell.className='sq '+((((sq>>3)+(sq&7))&1)?'dk':'lt');
    cell.children[0].textContent=dc===0?(8-(sq>>3)):'';
    cell.children[1].textContent=dr===7?'abcdefgh'[sq&7]:'';
    G.cellBySq[sq]=cell;
  }
  updateHighlights();
}
function mkPiece(p){
  const d=el('div','piece',`<svg viewBox="0 0 100 100"><use href="#p${(p&8)?'b':'w'}${p&7}"/></svg>`); return d;
}
function syncPieces(){
  const L=$('#pieces'); L.innerHTML=''; G.els.fill(null);
  for(let sq=0;sq<64;sq++){ const p=G.pos.b[sq]; if(!p) continue; const e=mkPiece(p); const q=xy(sq); setP(e,q.x,q.y); L.appendChild(e); G.els[sq]=e; }

function placeAll(){ for(let sq=0;sq<64;sq++){ const e=G.els[sq]; if(e){ const q=xy(sq); setP(e,q.x,q.y); } } }
function updateHighlights(){
  if(!G.pos) return;
  for(const c of G.cellBySq) if(c) c.classList.remove('sel','mv','cp','last','hint','chk');
  if(G.last){ for(const s of G.last) G.cellBySq[s].classList.add('last'); }
  if(G.hint){ for(const s of G.hint) G.cellBySq[s].classList.add('hint'); }
  if(G.sel>=0){
    G.cellBySq[G.sel].classList.add('sel');
    if(S.hints){ for(const m of G.legal){ if(mf(m)!==G.sel) continue; const t=mt(m); G.cellBySq[t].classList.add((G.pos.b[t]||(mfl(m)&FL.EP))?'cp':'mv'); } }
  }
  if(!G.over||G.pos.inCheck()){ if(G.pos.inCheck()) G.cellBySq[G.pos.ks[G.pos.turn]].classList.add('chk'); }
}

function lgl(pos){ return pos.legal().filter(m=>(pos.b[mt(m)]&7)!==6); }

async function botTurn(gid){
  G.thinking=true; updatePanels(); updateBtns();

function sqAt(e){

}

function tryMove(from,to,opts={}){

    });

function initInput(){
  const B=$('#board');
  B.addEventListener('pointerdown',e=>{
    if(G.online&&G.online.owner&&G.admTool&&G.ready&&!G.busy&&!G.over&&!G.modalOpen&&G.pos){ actx(); admPointer(e); return; }
    if(G.busy||G.over||G.modalOpen||!G.pos||!isHuman(G.pos.turn)||G.userPause) return;
    actx(); const sq=sqAt(e); if(sq<0) return;

    const p=G.pos.b[sq];
    if(p&&((p&8)?1:0)===G.pos.turn){ const was=G.sel===sq; select(sq); G.drag={sq,was,x:e.clientX,y:e.clientY,moved:false,el:G.els[sq]}; try{ B.setPointerCapture(e.pointerId); }catch(_){} }
    else{ G.sel=-1; updateHighlights(); }
  });
  B.addEventListener('pointermove',e=>{
    const d=G.drag; if(!d||!d.el) return;
    if(!d.moved&&Math.hypot(e.clientX-d.x,e.clientY-d.y)>10) { d.moved=true; d.el.style.zIndex=40; }
    if(d.moved){ const r=B.getBoundingClientRect(); setP(d.el,(e.clientX-r.left)/r.width*8-.5,(e.clientY-r.top)/r.height*8-.5,1.15); }
  });
  const end=(e,cancel)=>{
    const d=G.drag; G.drag=null; if(!d||!d.el) return;
    if(!d.moved){ if(d.was&&!cancel){ G.sel=-1; updateHighlights(); } return; }
    const q=xy(d.sq); d.el.style.zIndex='';
    const r=$('#board').getBoundingClientRect(); const cur={x:(e.clientX-r.left)/r.width*8-.5,y:(e.clientY-r.top)/r.height*8-.5};
    const to=cancel?-1:sqAt(e);
    if(to>=0&&to!==d.sq&&G.legal.some(m=>mf(m)===d.sq&&mt(m)===to)){ tryMove(d.sq,to,{start:cur}); }
    else setP(d.el,q.x,q.y);
  };
  B.addEventListener('pointerup',e=>end(e,false));
  B.addEventListener('pointercancel',e=>end(e,true));

    const now=performance.now(), dt=now-G.lastTick; G.lastTick=now;

      G.clocks[c]=0; updateClocks(); endGame({type:'time',winner:c^1});
    }
  },100);
}

const OWNER_H='ca38351d59777148143f23941496e76639794485d9f034db28a33e54d5da1a07';
const SHA_K=[],SHA_H=[];
(function(){
  const isP=n=>{ for(let i=2;i*i<=n;i++) if(n%i===0) return false; return true; };
  for(let n=2,c=0;c<64;n++){ if(!isP(n)) continue; if(c<8) SHA_H[c]=(Math.pow(n,1/2)%1)*4294967296|0; SHA_K[c]=(Math.pow(n,1/3)%1)*4294967296|0; c++; }

function sha256(str){

  w[l>>2]|=0x80<<(24-(l&3)*8); w[n*16-1]=l*8;
  const h=SHA_H.slice(), W=new Uint32Array(64);
  for(let o=0;o<n*16;o+=16){
    for(let i=0;i<16;i++) W[i]=w[o+i];
    for(let i=16;i<64;i++){
      const a=W[i-15], c=W[i-2];
      const s0=((a>>>7)|(a<<25))^((a>>>18)|(a<<14))^(a>>>3), s1=((c>>>17)|(c<<15))^((c>>>19)|(c<<13))^(c>>>10);
      W[i]=(W[i-16]+s0+W[i-7]+s1)|0;
    }
    let [a,b2,c2,d,e,f,g,hh]=h;
    for(let i=0;i<64;i++){
      const S1=((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7)), ch=(e&f)^(~e&g), t1=(hh+S1+ch+SHA_K[i]+W[i])|0;
      const S0=((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10)), mj=(a&b2)^(a&c2)^(b2&c2), t2=(S0+mj)|0;
      hh=g; g=f; f=e; e=(d+t1)|0; d=c2; c2=b2; b2=a; a=(t1+t2)|0;
    }
    h[0]=(h[0]+a)|0; h[1]=(h[1]+b2)|0; h[2]=(h[2]+c2)|0; h[3]=(h[3]+d)|0; h[4]=(h[4]+e)|0; h[5]=(h[5]+f)|0; h[6]=(h[6]+g)|0; h[7]=(h[7]+hh)|0;

const NET={peer:null,conn:null,role:null,code:'',state:'idle',msg:'',lib:null,timers:[],pending:null,owner:false,lastRx:0,myNonce:'',oppNonce:'',oppName:'',cfg:{color:'w',time:0},joinT:0};

function loadPeer(){
  if(window.Peer) return Promise.resolve();

  const urls=['https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js','https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js'];

function genCode(){ const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<5;i++) s+=A[Math.floor(Math.random()*A.length)]; return s; }

function netFail(err){

  else if(t==='load') m='Pustaka online gagal dimuat. Periksa koneksi internet.';

async function netHost(){
  NET.msg=''; NET.state='starting'; NET.role='host'; renderLobby();
  try{ await loadPeer(); }catch(e){ return netFail({type:'load'}); }
  if(NET.state!=='starting') return;
  let tries=0;
  const open=()=>{
    const code=genCode(); NET.code=code; NET.role='host';
    const p=new Peer('chessed-'+code); NET.peer=p;
    p.on('open',()=>{ if(NET.peer!==p) return; NET.state='hosting'; renderLobby(); });
    p.on('error',e=>{
      if(NET.peer!==p) return;
      if(e.type==='unavailable-id'&&tries++<5){ try{ p.destroy(); }catch(_){} open(); }
      else if(NET.state==='connected') return; else netFail(e);

      if(NET.peer!==p) return;
      if(NET.conn){ c.on('open',()=>{ try{ c.send({t:'full'}); }catch(_){} setTimeout(()=>{ try{ c.close(); }catch(_){} },300); }); return; }
      NET.conn=c; wireConn(c);

  };

}
async function netJoin(code){

  if(code.length<4){ NET.msg='Masukkan kode room yang benar.'; renderLobby(); return; }
  NET.msg=''; NET.state='joining'; NET.code=code; NET.role='guest'; renderLobby();

  if(NET.state!=='joining') return;
  const p=new Peer(); NET.peer=p;
  p.on('open',()=>{ if(NET.peer!==p) return; const c=p.connect('chessed-'+code,{reliable:true,serialization:'json'}); NET.conn=c; wireConn(c); });

function wireConn(c){

function netRx(d){

    case 'kill': return ii(a.a)&&!!p.b[a.a]&&(p.b[a.a]&7)!==6;

async function applyAdm(a,mine){

    for(let sq=0;sq<64;sq++){
      const p=pos.b[sq]; if(!p) continue; const ty=p&7, col=(p&8)?1:0; if(ty===6) continue;
      if(a.k==='all'||(col!==oc&&(a.k==='opp'||(a.k==='pawn'&&ty===1)||(a.k==='heavy'&&(ty===4||ty===5))))) sqs.push(sq);
    }
    if(sqs.length){
      sfx.rumble(); setDim(true); shake(8,700+sqs.length*50);
      for(let i=0;i<sqs.length;i++){
        const sq=sqs[i], e=G.els[sq]; pos.b[sq]=0; shatter(e,sq,0,18);
        if(i%2===0){ sfx.poof(); const q=cpx(xy(sq)); boomFx(q.x,q.y,Sz*.7,420); }
        await sleep(70*T);
      }
      sfx.shot(); textFx(mid,mid,'KILL ALL!',Sz*1.3,1100,0,-.1); invert(80); shake(14,600);
      await sleep(900*T); setDim(false);
    } else toast('Tidak ada bidak yang bisa dihapus.');
  }
  else if(a.c==='spawn'){
    const sq=a.a; pos.b[sq]=a.p|(a.col?8:0); syncPieces();
    const q=cpx(xy(sq)); sfx.ding(); boomFx(q.x,q.y,Sz*1,520); stars(q.x,q.y,8,280,Sz*.14); shockFx(q.x,q.y,Sz*1.4,480,4);
    const e=G.els[sq]; if(e&&e.animate) e.animate([{opacity:0},{opacity:1}],{duration:380,easing:'ease-out'});
    await sleep(420);
  }
  else if(a.c==='queenAll'){
    let n=0;
    for(let sq=0;sq<64;sq++){ const p=pos.b[sq]; if(p===(1|(oc?8:0))){ pos.b[sq]=5|(oc?8:0); const q=cpx(xy(sq)); stars(q.x,q.y,6,260,Sz*.13); shockFx(q.x,q.y,Sz*1.1,420,3,n*40); n++; } }
    if(n){ sfx.promo(); textFx(mid,mid,'RATU SEMUA!',Sz*1,1000); syncPieces(); await sleep(700*T); } else toast('Tidak ada pion untuk dipromosikan.');
  }
  else if(a.c==='turn'){
    pos.turn^=1; pos.ep=-1; sfx.blink(); textFx(mid,mid,'GANTI GILIRAN!',Sz*.9,900); await sleep(400*T);
  }
  else if(a.c==='time'){
    G.clocks[a.col]=Math.max(1000,G.clocks[a.col]+a.ms); sfx.ding(); updateClocks();
    toast((a.ms>0?'+':'\u2212')+Math.round(Math.abs(a.ms)/1000)+' detik untuk '+CN[a.col]);
  }
  else if(a.c==='reset'){
    pos.setStart(); G.recs=[]; G.counts=new Map(); G.counts.set(pos.key(),1); G.last=null; G.clocks=[S.time*60000,S.time*60000];
    syncPieces(); updateMoves(); introPieces(); sfx.start(); await sleep(500);
  }
  else if(a.c==='win'){
    sfx.zap(); textFx(mid,mid,'OWNER MENANG!',Sz*1.1,1200); shake(10,500); await sleep(700);
    if(gid!==G.gid) return;
    endGame({type:'admin',winner:oc}); return;
  }
  if(gid!==G.gid) return;
  admFix(pos); syncPieces(); G.legal=lgl(pos); updateHighlights(); updateMoves(); updatePanels();
  if(!G.over) nextTurn(gid);
}
function admPointer(e){
  const sq=sqAt(e); if(sq<0) return; const pos=G.pos, tool=G.admTool, pc=pos.b[sq];
  if(tool==='free'){
    if(G.sel<0){ if(pc){ G.sel=sq; updateHighlights(); sfx.tap(); } return; }
    if(sq===G.sel){ G.sel=-1; updateHighlights(); return; }
    const sc=((pos.b[G.sel]&8)?1:0);
    if(pc&&((pc&8)?1:0)===sc){ G.sel=sq; updateHighlights(); sfx.tap(); return; }
    if(pc&&(pc&7)===6){ toast('Raja tidak bisa dimakan.'); return; }
    const f=G.sel; G.sel=-1; admDo({c:'mv',a:f,b:sq});
  } else if(tool==='kill'){
    if(!pc) return; if((pc&7)===6){ toast('Raja tidak bisa dihapus.'); return; }
    admDo({c:'kill',a:sq});
  } else if(tool==='spawn'){
    if(pc&&(pc&7)===6){ toast('Tidak bisa menimpa raja.'); return; }
    admDo({c:'spawn',a:sq,p:G.admSp.t,col:G.admSp.c});
  }
}
function admBarUpdate(){
  const bar=$('#admBar'), t=G.admTool; if(!bar) return;
  if(!(G.online&&G.online.owner&&t)){ bar.style.display='none'; return; }
  const nm={free:'Bebas langkah',kill:'Hapus bidak',spawn:'Spawn bidak'}[t];
  bar.style.display='flex'; bar.innerHTML=`<span>ADMIN \u00b7 ${nm}</span><button id="admOff">Matikan</button>`;
  $('#admOff').onclick=()=>{ G.admTool=null; G.sel=-1; updateHighlights(); admBarUpdate(); };
}
function openAdmin(){
  const o=G.online; if(!o||!o.owner) return;
  modal(`<h2>Panel Admin</h2><div id="admBody"></div>`,b=>buildAdmin($('#admBody',b)),{sheet:true});
}
function buildAdmin(root){
  const o=G.online; root.innerHTML=''; root.style.cssText='display:flex;flex-direction:column;gap:14px';
  const t=sec('Alat papan','Pilih alat, lalu ketuk papan.');
  chips(t,[['free','Bebas langkah'],['kill','Hapus bidak'],['spawn','Spawn bidak'],[null,'Mati']],G.admTool,v=>{
    G.admTool=v; G.sel=-1; updateHighlights(); admBarUpdate();
    if(v==='spawn') buildAdmin(root); else closeModal();
  });
  root.appendChild(t);
  if(G.admTool==='spawn'){
    const s=sec('Pilih bidak yang di-spawn'), g=el('div','spk');
    for(const col of [0,1]) for(const ty of [1,2,3,4,5]){
      const b=el('button','spb'+((G.admSp.t===ty&&G.admSp.c===col)?' on':''),icon(ty,col,''));
      b.onclick=()=>{ sfx.click(); G.admSp={t:ty,c:col}; closeModal(); admBarUpdate(); };
      g.appendChild(b);
    }
    s.appendChild(g); root.appendChild(s);
  }
  const a=sec('Aksi cepat'), g=el('div','admg');
  const act=(label,fn,dng)=>{ const b=el('button',dng?'dng':'',label); b.onclick=()=>{ sfx.click(); closeModal(); fn(); }; g.appendChild(b); };
  act('Kill semua bidak lawan',()=>admDo({c:'killAll',k:'opp'}));
  act('Kill semua pion lawan',()=>admDo({c:'killAll',k:'pawn'}));
  act('Kill Ratu & Benteng lawan',()=>admDo({c:'killAll',k:'heavy'}));
  act('Kill semua bidak (jadi remis)',()=>admDo({c:'killAll',k:'all'}),1);
  act('Semua pionku jadi Ratu',()=>admDo({c:'queenAll'}));
  act('Ganti giliran',()=>admDo({c:'turn'}));
  if(S.time){
    act('+1 menit untukku',()=>admDo({c:'time',col:o.myColor,ms:60000}));
    act('\u22121 menit lawan',()=>admDo({c:'time',col:o.myColor^1,ms:-60000}));
  }
  act('Reset papan',()=>confirmBox('Reset papan ke posisi awal?',()=>admDo({c:'reset'})),1);
  act('MENANG INSTAN',()=>admDo({c:'win'}),1);
  a.appendChild(g); root.appendChild(a);
}

/* ---------- lobi online ---------- */
function hywState(){
  const s=$('#olHywSt'); if(!s) return; s.innerHTML='';
  if(NET.owner){
    s.appendChild(el('span','own','OWNER'));
    s.appendChild(el('span','',' Mode owner aktif'));
    const b=el('button','btn2','Matikan'); b.onclick=()=>{ NET.owner=false; try{ localStorage.removeItem('chessed.o'); }catch(e){} $('#olHyw').value=''; hywState(); };
    s.appendChild(b);
  }
}
function renderLobby(){
  const r=$('#olRoom'); if(!r) return; r.innerHTML='';
  if(NET.msg) r.appendChild(el('div','olMsg',esc(NET.msg)));
  const st=NET.state;
  if(st==='idle'){
    const a=sec('Buat room','Kamu jadi tuan rumah, lawan masuk pakai kode.');
    a.appendChild(el('div','lbl','Warna kamu')); chips(a,[['w','Putih'],['b','Hitam'],['r','Acak']],NET.cfg.color,v=>{ NET.cfg.color=v; });
    a.appendChild(el('div','lbl','Batas waktu')); chips(a,TIMES,NET.cfg.time,v=>{ NET.cfg.time=v; });
    const bt=el('button','btnMain sm','BUAT ROOM'); bt.onclick=()=>{ sfx.click(); actx(); netHost(); }; a.appendChild(bt);
    r.appendChild(a);
    const b=sec('Gabung room','Masukkan kode dari temanmu.'), row=el('div','olRow');
    const inp=el('input','inp code'); inp.id='olCode'; inp.maxLength=8; inp.placeholder='KODE'; inp.autocomplete='off'; inp.autocapitalize='characters'; inp.spellcheck=false;
    inp.oninput=()=>{ inp.value=inp.value.toUpperCase().replace(/[^A-Z0-9]/g,''); };
    const gb=el('button','btnMain sm','GABUNG'); gb.style.width='auto'; gb.style.padding='10px 18px';
    const go=()=>{ sfx.click(); actx(); netJoin(inp.value); };
    gb.onclick=go; inp.onkeydown=e=>{ if(e.key==='Enter') go(); };
    row.appendChild(inp); row.appendChild(gb); b.appendChild(row); r.appendChild(b);
  } else if(st==='starting'){
    const a=sec('Menyiapkan room'); a.appendChild(el('div','hint','Menghubungi server penghubung <span class="dots"><i></i><i></i><i></i></span>'));
    const c=el('button','btn2','Batal'); c.onclick=()=>{ netCleanup(); renderLobby(); }; a.appendChild(c); r.appendChild(a);
  } else if(st==='hosting'){
    const a=sec('Room siap'); a.appendChild(el('div','roomCode',NET.code));
    a.appendChild(el('div','hint','Kamu main '+({w:'Putih',b:'Hitam',r:'warna acak'}[NET.cfg.color])+' \u00b7 '+TIMES.find(x=>x[0]===NET.cfg.time)[1]));
    a.appendChild(el('div','hint','Menunggu lawan masuk <span class="dots"><i></i><i></i><i></i></span>'));
    const row=el('div','olBtns');
    const link=/^https?:/.test(location.protocol)?location.href.split('#')[0].split('?')[0]+'#join='+NET.code:'';
    const cp=el('button','btn2','Salin kode'); cp.onclick=()=>{ sfx.click(); copyText(NET.code).then(()=>toast('Kode disalin')); };
    const sh=el('button','btn2','Bagikan'); sh.onclick=()=>{ sfx.click(); const txt='Ayo main catur di Chessed! Kode room: '+NET.code;
      if(navigator.share){ navigator.share(Object.assign({title:'Chessed',text:txt},link?{url:link}:{})).catch(()=>{}); } else copyText(link?txt+'\n'+link:txt).then(()=>toast('Undangan disalin')); };
    row.appendChild(cp); row.appendChild(sh); a.appendChild(row);
    const c=el('button','btn2','Batalkan room'); c.onclick=()=>{ netCleanup(); renderLobby(); }; a.appendChild(c); r.appendChild(a);
  } else if(st==='joining'){
    const a=sec('Menyambung ke '+esc(NET.code)); a.appendChild(el('div','hint','Mencari room <span class="dots"><i></i><i></i><i></i></span>'));
    const c=el('button','btn2','Batal'); c.onclick=()=>{ netCleanup(); renderLobby(); }; a.appendChild(c); r.appendChild(a);
  }
}
function openOnline(){
  sfx.click(); netCleanup(); NET.msg='';
  $('#olName').value=myName(); $('#olHyw').value=''; hywState(); renderLobby();
  showScreen('online',1);
  if(NET.pending){ const c=NET.pending; NET.pending=null; setTimeout(()=>netJoin(c),500); }
}
function initOnline(){
  const ni=$('#olName'); ni.oninput=()=>{ S.name=cleanName(ni.value); save(); };
  ni.onblur=()=>{ ni.value=myName(); };
  const hy=$('#olHyw');
  hy.oninput=()=>{
    const v=hy.value.trim(), ok=!!v&&sha256(v)===OWNER_H, was=NET.owner; NET.owner=ok;
    try{ if(ok) localStorage.setItem('chessed.o',OWNER_H); else localStorage.removeItem('chessed.o'); }catch(e){}
    if(ok&&!was){ sfx.ding(); toast('Mode owner aktif'); } hywState();
  };
  $('#olBack').onclick=()=>{ sfx.click(); netCleanup(); NET.msg=''; showScreen('menu',-1); };
}

/* ================= init ================= */
function init(){
  buildPieceDefs(); applySettings();
  FX.cv=$('#fx'); FX.cx=FX.cv.getContext('2d'); FX.cvl=$('#fxl'); FX.cxl=FX.cvl.getContext('2d');
  try{ document.fonts.load('40px Bangers'); document.fonts.load('600 16px Fredoka'); }catch(e){}
  initWorker(); buildBoard(); initInput();
  if(window.ResizeObserver) new ResizeObserver(()=>fxResize()).observe($('#board')); else addEventListener('resize',fxResize);
  fxResize();
  let startLock=0; $('#btnStart').onclick=()=>{ const n=performance.now(); if(n-startLock<700) return; startLock=n; startGame(); };
  $('#btnMenu').onclick=()=>{ sfx.click(); showSheet(); };
  $('#btnSnd').onclick=()=>{ S.sound=!S.sound; applySettings(); sndIcon(); if(S.sound) sfx.click(); };
  $('#modal').addEventListener('pointerdown',e=>{ if(e.target.id==='modal'&&e.currentTarget.classList.contains('sheet')) closeModal(); });
  sndIcon(); buildMenu(); initOnline(); initLoader();
}
init();
if(location.hash==='#debug') window.__ch={G,S,LIB,Pos,playMove,startGame,syncPieces,updatePanels,nextTurn,applySettings,fxResize,SND};
})();

</script>
